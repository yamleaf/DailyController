// DailyController/app/build.gradle
import java.text.SimpleDateFormat

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
}

// ==== 构建标识（在 android{} 之外定义，供 defaultConfig 与产物命名共用）====

// git 短哈希：优先取 CI 注入的 GIT_COMMIT_SHORT，本地编译回退到实际 git HEAD，
// 都拿不到才退化为 nogit（回退值刻意不叫 local，避免与下面的构建来源标识混淆）
def gitShort = {
    def fromEnv = System.getenv('GIT_COMMIT_SHORT')
    if (fromEnv) return fromEnv.take(7)
    try {
        def proc = 'git rev-parse --short=7 HEAD'.execute(null, rootDir)
        proc.waitFor()
        if (proc.exitValue() == 0) {
            def sha = proc.text.trim()
            if (sha) return sha.take(7)
        }
    } catch (Exception ignored) {
    }
    return 'nogit'
}()

// 构建来源标识：区分 CI 产物与本机手工编译产物。
// GITHUB_ACTIONS/CI 由 GitHub Actions 自动注入，无需在 workflow 里手工声明；
// 另留 BUILD_SOURCE 环境变量作为显式覆盖通道（迁移到其他 CI 时可手工指定）。
def buildSource = System.getenv('BUILD_SOURCE') ?:
        (((System.getenv('GITHUB_ACTIONS') == 'true') || (System.getenv('CI') == 'true')) ? 'ci' : 'local')

// 产物标识：<构建来源>-<git短哈希>，如 local-fa96b30 / ci-abcdef1。
// 既是 APK 文件名的核心段，也拼进 versionName，扫一眼就知道包从哪来、对应哪个提交。
def buildTag = "${buildSource}-${gitShort}"

// 构建时间（分钟精度，与 versionCode 的 2 分钟粒度相称，避免秒级变动导致无谓重编）
def buildTime = new SimpleDateFormat('yyyy-MM-dd HH:mm', Locale.CHINA).format(new Date())

android {
    namespace 'com.yample.daily.controller'
    compileSdk 36

    defaultConfig {
        applicationId 'com.yample.daily.controller'
        minSdk 26
        targetSdk 36

        // 版本号策略（对齐被控端 DailyTask/app/build.gradle）：
        // - baselineVersion 为正式发版基线号，随功能迭代手工上调
        // - 默认（未设置 BUILD_FLAVOR 或其值不为 release）：自动版本
        //     versionName = <基线>-<构建来源>-<git短哈希>，如 1.0.0-local-fa96b30
        // - 仅当显式 BUILD_FLAVOR=release 时使用固定版本号（正式发版用）
        def baselineVersion = '1.0.0'

        // 版本信息页所需的构建元数据
        buildConfigField 'String', 'BUILD_SOURCE', "\"$buildSource\""
        buildConfigField 'String', 'GIT_SHA', "\"$gitShort\""
        buildConfigField 'String', 'BUILD_TIME', "\"$buildTime\""
        buildConfigField 'String', 'BASELINE_VERSION', "\"$baselineVersion\""

        def isAlphaBuild = System.getenv('BUILD_FLAVOR') != 'release'
        if (isAlphaBuild) {
            // versionCode = yyMMdd*1000 + 720 + (HH*30 + mm/2)
            //
            // 为什么不是原来的 yyMMdd*1000 + HHmm：HHmm 最大 2359 远超 1000，10:00 之后必然进位
            // 污染日期位，导致「今天 23:59 的包 > 明天 00:01 的包」——Android 拒绝 versionCode 降级，
            // 第二天凌晨打的新包反而装不上前一晚的旧包，且 08-04 10:12 与 08-05 00:12 会算出同一个数。
            //
            // 现算法：(HH*30 + mm/2) 是「当天第几个 2 分钟片」，取值 0..719，绝不越界；
            // +720 偏移把当天取值抬进 [720,1439] 区间，作用有二：
            //   1) 保证严格大于历史上按旧算法已发出的版本号（如 260805012），不会触发降级；
            //   2) 跨天时 (D+1)*1000+720 恒大于 D*1000+1439，全局严格单调。
            // 上限 991231*1000+1439 ≈ 9.9e8，远低于 int 上限 2.147e9，不会溢出。
            // 代价：同 2 分钟内的两次构建会得到相同 versionCode（一次构建耗时 1~5 分钟，不构成问题）。
            def now = new Date()
            def ymd = new SimpleDateFormat('yyMMdd', Locale.CHINA).format(now).toInteger()
            def hh = new SimpleDateFormat('HH', Locale.CHINA).format(now).toInteger()
            def mm = new SimpleDateFormat('mm', Locale.CHINA).format(now).toInteger()
            versionName "${baselineVersion}-${buildTag}"
            versionCode ymd * 1000 + 720 + (hh * 30 + (int) (mm / 2))
        } else {
            // 正式发版：CI 产物保持干净版本号；本机手工打的「正式包」强制带 -local 后缀，
            // 避免本地包被误当成正式发布包分发出去。
            versionCode 100
            versionName buildSource == 'ci' ? baselineVersion : "${baselineVersion}-local"
        }
    }

    signingConfigs {
        release {
            storeFile file('DailyTask.jks')
            storePassword '123456789'
            keyAlias 'key0'
            keyPassword '123456789'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        // AGP 8+ 默认关闭 buildConfig，此处需生成 BuildConfig.BUILD_SOURCE
        buildConfig true
        viewBinding true
    }

    // 产物命名（对齐被控端）：dailyController_<构建来源>-<git短哈希>_<构建类型>.apk
    // 如 dailyController_local-fa96b30_debug.apk / dailyController_ci-abcdef1_release.apk。
    // 刻意不带版本号：版本号已在 App 内「版本信息」页与 versionName 中可查，
    // 文件名只承担「这个包从哪来、对应哪次提交」的溯源职责，短而稳定，便于分发与对账。
    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            outputFileName = "dailyController_${buildTag}_${variant.buildType.name}.apk"
        }
    }
}

dependencies {
    implementation project(':protocol')
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    
    // MQTT
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
    // QR
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    // Room
    implementation 'androidx.room:room-runtime:2.8.2'
    kapt 'androidx.room:room-compiler:2.8.2'
    implementation 'androidx.room:room-ktx:2.8.2'
    // Gson
    implementation 'com.google.code.gson:gson:2.11.0'
}
