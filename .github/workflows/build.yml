name: Build DailyController

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      # 被控端下载地址：单一匿名公共地址（下载中心，GitHub Pages 静态页，恒定地址）。
      # 取消 GitHub Releases / 镜像直链，统一只走此匿名入口。
      CTRL_DOWNLOAD_URL: "https://yamleaf.github.io/DailyController/"
      # 版本号/产物命名（对齐被控端）：alpha 自动版本 + git 短哈希 + 构建来源，
      # 产出 dailyController_v1.0.0-alpha-<sha7>-ci_<buildType>.apk，每次构建 versionCode 唯一。
      # 正式发版时把 BUILD_FLAVOR 改为 release，即产出 dailyController_v1.0.0_<buildType>.apk
      BUILD_FLAVOR: alpha
      GIT_COMMIT_SHORT: ${{ github.sha }}
      # 构建来源标识：CI 产物版本号带 -ci 后缀，本机手工编译带 -local，便于一眼区分包的出处。
      # GITHUB_ACTIONS 环境变量本可自动识别，此处显式声明以防迁移到其他 CI 时失效。
      BUILD_SOURCE: ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Show generated version info
        run: |
          echo "BUILD_FLAVOR=$BUILD_FLAVOR"
          echo "GIT_COMMIT_SHORT=$GIT_COMMIT_SHORT"
          echo "BUILD_SOURCE=$BUILD_SOURCE"

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dailyController_debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: dailyController_release
          path: app/build/outputs/apk/release/*.apk

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dailyController-${{ github.run_number }}
          name: DailyController Build #${{ github.run_number }}
          body: |
            Auto-built by GitHub Actions.

            - Branch: ${{ github.ref_name }}
            - Commit: ${{ github.sha }}
            - Note: This release is for testing and experience.
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
