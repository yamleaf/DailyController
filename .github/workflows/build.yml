name: Build DailyController

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      # 被控端下载地址：单一匿名公共地址（下载中心，GitHub Pages 静态页，恒定地址）。
      # 取消 GitHub Releases / 镜像直链，统一只走此匿名入口。
      CTRL_DOWNLOAD_URL: "https://yamleaf.github.io/DailyController/"
      # 版本号（对齐被控端）：alpha 自动版本 versionName = git 短哈希，每次构建 versionCode 唯一；
      # ci/local、基线版本等完整信息见 App 内「版本信息」弹窗。
      # 产物命名：dailyController_<构建来源>-<git短哈希>_<buildType>.apk，如 dailyController_ci-abcdef1_debug.apk。
      # 正式发版时把 BUILD_FLAVOR 改为 release，即产出 dailyController_1.0.0_<buildType>.apk
      BUILD_FLAVOR: alpha
      GIT_COMMIT_SHORT: ${{ github.sha }}
      # 构建来源标识：CI 产物版本号带 -ci 后缀，本机手工编译带 -local，便于一眼区分包的出处。
      # GITHUB_ACTIONS 环境变量本可自动识别，此处显式声明以防迁移到其他 CI 时失效。
      BUILD_SOURCE: ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Show generated version info
        run: |
          echo "BUILD_FLAVOR=$BUILD_FLAVOR"
          echo "GIT_COMMIT_SHORT=$GIT_COMMIT_SHORT"
          echo "BUILD_SOURCE=$BUILD_SOURCE"

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dailyController_debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: dailyController_release
          path: app/build/outputs/apk/release/*.apk

      - name: Compute release metadata
        id: meta
        run: |
          # 北京时间（Asia/Shanghai）
          export TZ='Asia/Shanghai'
          DATE_TAG=$(date +'%Y%m%d')
          SHA7=$(echo "${{ github.sha }}" | cut -c1-7)
          BASELINE=$(grep "def baselineVersion" app/build.gradle | sed -E "s/.*'([0-9.]+)'.*/\1/")
          echo "version=${BASELINE:-1.0.0}-alpha" >> "$GITHUB_OUTPUT"
          echo "tag=dailyController-${DATE_TAG}-${SHA7}-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "name=DailyController v${BASELINE:-1.0.0}-alpha (Build #${{ github.run_number }})" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | head -1)
          echo "## Changelog" > CHANGELOG.md
          if [ -n "$PREV_TAG" ]; then
            git log --oneline --no-merges "$PREV_TAG"..HEAD --pretty=format:'- %s' >> CHANGELOG.md
          else
            git log --oneline --no-merges -30 --pretty=format:'- %s' >> CHANGELOG.md
          fi
          echo "" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "---" >> CHANGELOG.md
          echo "- Branch: ${{ github.ref_name }}" >> CHANGELOG.md
          echo "- Commit: ${{ github.sha }}" >> CHANGELOG.md

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          body_path: CHANGELOG.md
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: true
